<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codex React Component Generator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }
        
        .input-panel {
            padding: 30px;
            border-right: 1px solid #e5e7eb;
        }
        
        .output-panel {
            padding: 30px;
            background: #f8fafc;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }
        
        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        .button {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .code-container {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .code-header {
            background: #334155;
            padding: 12px 16px;
            color: #e2e8f0;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .copy-button {
            background: #475569;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .copy-button:hover {
            background: #64748b;
        }
        
        pre {
            margin: 0;
            padding: 20px;
            overflow-x: auto;
            background: #1e293b;
            color: #e2e8f0;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .preview-container {
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            background: white;
            margin-bottom: 20px;
        }
        
        .preview-header {
            background: #f1f5f9;
            padding: 12px 16px;
            margin: -20px -20px 20px -20px;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .metadata {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #64748b;
        }
        
        .examples {
            margin-bottom: 20px;
        }
        
        .example-button {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-right: 8px;
            margin-bottom: 8px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        
        .example-button:hover {
            background: #e2e8f0;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .input-panel {
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [prompt, setPrompt] = useState('');
            const [model, setModel] = useState('gpt-4o-mini');
            const [provider, setProvider] = useState('openai');
            const [framework, setFramework] = useState('react-typescript');
            const [includeStyles, setIncludeStyles] = useState(true);
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [examples, setExamples] = useState([]);

            const API_BASE = window.location.origin.replace(':12001', ':12000'); // Adjust for different ports

            useEffect(() => {
                // Load examples
                fetch(`${API_BASE}/api/examples`)
                    .then(res => res.json())
                    .then(data => setExamples(data.examples || []))
                    .catch(console.error);
            }, []);

            const generateComponent = async () => {
                if (!prompt.trim()) {
                    setError('Please enter a prompt');
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);

                try {
                    const response = await fetch(`${API_BASE}/api/generate-component`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            prompt,
                            model,
                            provider,
                            framework,
                            includeStyles,
                        }),
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        setResult(data);
                    } else {
                        setError(data.error || 'Failed to generate component');
                    }
                } catch (err) {
                    setError('Network error: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text).then(() => {
                    // Could add a toast notification here
                });
            };

            const loadExample = (example) => {
                setPrompt(example.prompt);
                setFramework(example.framework);
                setIncludeStyles(example.includeStyles);
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>🤖 Codex React Component Generator</h1>
                        <p>Generate React components using AI - powered by OpenAI Codex</p>
                    </div>
                    
                    <div className="main-content">
                        <div className="input-panel">
                            <h3 style={{marginBottom: '20px', color: '#374151'}}>Generate Component</h3>
                            
                            {examples.length > 0 && (
                                <div className="examples">
                                    <label>Quick Examples:</label>
                                    {examples.map((example, index) => (
                                        <button
                                            key={index}
                                            className="example-button"
                                            onClick={() => loadExample(example)}
                                        >
                                            {example.title}
                                        </button>
                                    ))}
                                </div>
                            )}
                            
                            <div className="form-group">
                                <label>Prompt *</label>
                                <textarea
                                    value={prompt}
                                    onChange={(e) => setPrompt(e.target.value)}
                                    placeholder="Describe the React component you want to generate..."
                                />
                            </div>
                            
                            <div className="form-group">
                                <label>Provider</label>
                                <select value={provider} onChange={(e) => setProvider(e.target.value)}>
                                    <option value="openai">OpenAI</option>
                                    <option value="openrouter">OpenRouter</option>
                                    <option value="ollama">Ollama</option>
                                    <option value="gemini">Google Gemini</option>
                                    <option value="mistral">Mistral AI</option>
                                    <option value="groq">Groq</option>
                                </select>
                            </div>
                            
                            <div className="form-group">
                                <label>Model</label>
                                <input
                                    type="text"
                                    value={model}
                                    onChange={(e) => setModel(e.target.value)}
                                    placeholder="e.g., gpt-4o-mini"
                                />
                            </div>
                            
                            <div className="form-group">
                                <label>Framework</label>
                                <select value={framework} onChange={(e) => setFramework(e.target.value)}>
                                    <option value="react-typescript">React + TypeScript</option>
                                    <option value="react">React (JavaScript)</option>
                                </select>
                            </div>
                            
                            <div className="form-group">
                                <label>
                                    <input
                                        type="checkbox"
                                        checked={includeStyles}
                                        onChange={(e) => setIncludeStyles(e.target.checked)}
                                        style={{width: 'auto', marginRight: '8px'}}
                                    />
                                    Include Styles
                                </label>
                            </div>
                            
                            <button
                                className="button"
                                onClick={generateComponent}
                                disabled={loading}
                            >
                                {loading && <span className="loading"></span>}
                                {loading ? 'Generating...' : 'Generate Component'}
                            </button>
                        </div>
                        
                        <div className="output-panel">
                            <h3 style={{marginBottom: '20px', color: '#374151'}}>Generated Component</h3>
                            
                            {error && (
                                <div className="error">
                                    <strong>Error:</strong> {error}
                                </div>
                            )}
                            
                            {result && result.success && (
                                <>
                                    <div className="success">
                                        <strong>Success!</strong> Component "{result.component.name}" generated successfully.
                                    </div>
                                    
                                    <div className="code-container">
                                        <div className="code-header">
                                            <span>{result.component.name}.{framework === 'react-typescript' ? 'tsx' : 'jsx'}</span>
                                            <button
                                                className="copy-button"
                                                onClick={() => copyToClipboard(result.component.code)}
                                            >
                                                Copy
                                            </button>
                                        </div>
                                        <pre>{result.component.code}</pre>
                                    </div>
                                    
                                    {result.component.styles && (
                                        <div className="code-container">
                                            <div className="code-header">
                                                <span>Styles</span>
                                                <button
                                                    className="copy-button"
                                                    onClick={() => copyToClipboard(result.component.styles)}
                                                >
                                                    Copy
                                                </button>
                                            </div>
                                            <pre>{result.component.styles}</pre>
                                        </div>
                                    )}
                                    
                                    {result.component.dependencies.length > 0 && (
                                        <div className="code-container">
                                            <div className="code-header">
                                                <span>Dependencies</span>
                                                <button
                                                    className="copy-button"
                                                    onClick={() => copyToClipboard(`npm install ${result.component.dependencies.join(' ')}`)}
                                                >
                                                    Copy Install Command
                                                </button>
                                            </div>
                                            <pre>npm install {result.component.dependencies.join(' ')}</pre>
                                        </div>
                                    )}
                                    
                                    <div className="metadata">
                                        <strong>Generation Info:</strong><br/>
                                        Model: {result.metadata.model}<br/>
                                        Provider: {result.metadata.provider}<br/>
                                        Time: {result.metadata.generationTime}ms<br/>
                                        {result.metadata.tokensUsed && `Tokens: ${result.metadata.tokensUsed}`}
                                    </div>
                                </>
                            )}
                            
                            {!result && !error && !loading && (
                                <div style={{textAlign: 'center', color: '#64748b', padding: '60px 20px'}}>
                                    <div style={{fontSize: '48px', marginBottom: '16px'}}>⚡</div>
                                    <p>Enter a prompt and click "Generate Component" to get started!</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
